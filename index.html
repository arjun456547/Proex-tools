<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProbeX - Digital Intelligence Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00d4ff, #7b2ff7, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00d4ff, #7b2ff7);
            color: #fff;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔍 ProbeX</div>
        <h1>Digital Intelligence Platform</h1>
        <p>Login to access 9+ powerful OSINT tools</p>
        <button class="btn-primary" onclick="loginWithGoogle()">Login with Gmail</button>
    </div>

    <footer class="footer">
        <p>© 2024 ProbeX - All rights reserved</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDW604GFPs_388u_agQ-0omCTuuwjq8BA0",
            authDomain: "proex-tools.firebaseapp.com",
            projectId: "proex-tools",
            storageBucket: "proex-tools.firebasestorage.app",
            messagingSenderId: "1022958761161",
            appId: "1:1022958761161:web:d80262b7af25a374154918"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    alert('Login failed: ' + error.message);
                });
        }
    </script>
</body>
</html>
